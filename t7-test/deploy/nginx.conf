server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /t7-test {
        return 302 /t7-test/;
    }

    location /t7-test/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /t7-test/index.html;
    }

    location / {
        return 404;
    }
}
