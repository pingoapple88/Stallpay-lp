<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校鮮集｜物流託運單 Demo</title><style>body{margin:0;background:#0c2723;color:#eef5ef;font:15px/1.6 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:32px 20px}h1{color:#d9b56d}.card{background:#123832;border:1px solid #2c5a50;border-radius:14px;padding:18px}label{display:block;color:#a9c3ba;margin:8px 0 3px}input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #2c5a50;background:#0b2824;color:#eef5ef;font:inherit}button{margin-top:12px;background:#d9b56d;color:#152c27;font-weight:700}pre{white-space:pre-wrap;background:#091c1a;padding:12px;border-radius:8px}</style></head><body><main><h1>外部物流／託運單 Demo</h1><p>目前只建立託運單草稿與標籤預覽，不購買運單、不付款、不呼叫正式物流商。</p><section class="card"><label>訂單編號<input id="order" value="demo-order-001"></label><label>物流代碼<input id="carrier" value="mock-carrier"></label><label>配送方式<select id="mode"><option value="school_drop">學校配送</option><option value="cooperative_pickup">合作社取貨</option><option value="locker">取物櫃</option><option value="vending_machine">智販機</option><option value="home_delivery">宅配</option></select></label><button onclick="createShipment()">建立託運單草稿</button><button onclick="labelPreview()">產生標籤預覽</button><pre id="result">等待操作</pre></section></main><script>const H={'Content-Type':'application/json','X-Demo-Mode':'true'};let shipmentId;const id=()=>crypto.randomUUID();async function createShipment(){shipmentId=id();const body={shipment_id:shipmentId,organization_id:id(),order_reference:order.value,carrier_code:carrier.value,delivery_mode:mode.value,recipient_scope_id:id(),parcel_count:1,idempotency_key:'shipment-'+Date.now()};const r=await fetch('/api/v1/mock/logistics/shipments',{method:'POST',headers:H,body:JSON.stringify(body)});result.textContent=JSON.stringify(await r.json(),null,2)}async function labelPreview(){if(!shipmentId){result.textContent='請先建立託運單草稿';return}const r=await fetch('/api/v1/mock/logistics/shipments/'+shipmentId+'/label-preview',{method:'POST',headers:H});result.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
