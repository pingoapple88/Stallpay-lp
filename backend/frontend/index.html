<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校鮮集｜外部服務隔離 UAT</title><style>
:root{--bg:#0a2420;--card:#11352f;--line:#315a51;--gold:#d8b46a;--text:#edf5f1;--muted:#a8c2b9;--ok:#77d4a4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#071b18,#10372f);color:var(--text);font:15px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1,h2{color:var(--gold);margin:.3em 0}.badge{border:1px solid var(--gold);border-radius:999px;padding:5px 10px;color:var(--gold)}select,input,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px;background:#081f1b;color:var(--text);width:100%}button{background:var(--gold);color:#102b26;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(17,53,47,.94);border:1px solid var(--line);border-radius:15px;padding:18px}.notice{padding:13px;border-left:4px solid var(--gold);background:#0c2d27;color:var(--muted)}label{display:block;color:var(--muted);margin:9px 0 3px}pre{min-height:150px;white-space:pre-wrap;background:#061815;padding:12px;border-radius:10px;overflow:auto}.status{color:var(--ok);font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><div><span class="badge">ISOLATED UAT</span><h1 data-i="title">校鮮集外部服務測試台</h1></div><select id="lang" style="width:auto"><option value="zh">繁體中文</option><option value="en">English</option><option value="th">ไทย</option></select></div><p class="notice" data-i="notice">僅使用 synthetic 訂單與本機 sandbox provider；不建立真實託運、不扣款、不開票。</p><div class="grid"><section class="card"><h2 data-i="logistics">雲鼎物流 Sandbox</h2><label data-i="org">組織 ID</label><input id="org"><label data-i="shipment">託運參考</label><input id="shipment" value="SHIPUAT001"><button id="logisticsBtn" data-i="makeLabel">建立測試標籤</button><pre id="logisticsResult">—</pre></section><section class="card"><h2 data-i="payment">Intella Scan2Pay Sandbox</h2><label data-i="order">訂單編號（英數字，20 字內）</label><input id="order" value="PAYUAT001"><label data-i="amount">金額（最小貨幣單位）</label><input id="amount" type="number" value="100"><button id="paymentBtn" data-i="makePayment">建立測試付款</button><div class="actions"><button id="successBtn" data-i="success">模擬成功通知</button><button id="failSigBtn" data-i="badSign">模擬錯誤簽章</button></div><button id="queryBtn" data-i="query">查詢付款狀態</button><pre id="paymentResult">—</pre></section></div><p class="status" id="summary" data-i="ready">準備測試。建議順序：物流標籤 → 建立付款 → 成功通知 → 查詢狀態。</p></main><script>
const text={zh:{title:'校鮮集外部服務測試台',notice:'僅使用 synthetic 訂單與本機 sandbox provider；不建立真實託運、不扣款、不開票。',logistics:'雲鼎物流 Sandbox',payment:'Intella Scan2Pay Sandbox',org:'組織 ID',shipment:'託運參考',makeLabel:'建立測試標籤',order:'訂單編號（英數字，20 字內）',amount:'金額（最小貨幣單位）',makePayment:'建立測試付款',success:'模擬成功通知',badSign:'模擬錯誤簽章',query:'查詢付款狀態',ready:'準備測試。建議順序：物流標籤 → 建立付款 → 成功通知 → 查詢狀態。'},en:{title:'Xiaoxianji External Service UAT',notice:'Synthetic orders and local sandbox providers only. No real shipment, charge, or invoice is created.',logistics:'Yunding Logistics Sandbox',payment:'Intella Scan2Pay Sandbox',org:'Organization ID',shipment:'Shipment reference',makeLabel:'Create test label',order:'Order number (alphanumeric, max 20)',amount:'Amount in minor units',makePayment:'Create test payment',success:'Simulate success callback',badSign:'Simulate invalid signature',query:'Query payment status',ready:'Ready. Suggested flow: logistics label → payment → success callback → query.'},th:{title:'ระบบทดสอบบริการภายนอก Xiaoxianji',notice:'ใช้เฉพาะคำสั่งซื้อจำลองและผู้ให้บริการ sandbox ภายใน ไม่มีการจัดส่ง ตัดเงิน หรือออกใบกำกับเงินจริง',logistics:'Sandbox โลจิสติกส์ Yunding',payment:'Sandbox Intella Scan2Pay',org:'รหัสองค์กร',shipment:'ข้อมูลอ้างอิงการจัดส่ง',makeLabel:'สร้างฉลากทดสอบ',order:'เลขคำสั่งซื้อ (ตัวอักษร/ตัวเลข ไม่เกิน 20)',amount:'จำนวนเงินหน่วยย่อย',makePayment:'สร้างการชำระเงินทดสอบ',success:'จำลอง callback สำเร็จ',badSign:'จำลองลายเซ็นผิด',query:'ตรวจสอบสถานะการชำระเงิน',ready:'พร้อมทดสอบ: ฉลากโลจิสติกส์ → การชำระเงิน → callback สำเร็จ → ตรวจสอบสถานะ'}};
const H={'Content-Type':'application/json','X-UAT-Mode':'isolated'};org.value=crypto.randomUUID();let paymentRef='';const out=(id,v)=>document.getElementById(id).textContent=JSON.stringify(v,null,2);async function call(url,opt={}){const r=await fetch(url,{...opt,headers:{...H,...(opt.headers||{})}});const v=await r.json();if(!r.ok)throw v;return v}logisticsBtn.onclick=async()=>{try{out('logisticsResult',await call('/api/v1/uat/logistics/labels',{method:'POST',body:JSON.stringify({organization_id:org.value,shipment_reference:shipment.value})}))}catch(e){out('logisticsResult',e)}};paymentBtn.onclick=async()=>{try{const v=await call('/api/v1/uat/payments',{method:'POST',body:JSON.stringify({organization_id:org.value,order_reference:order.value,amount_minor:Number(amount.value)})});paymentRef=v.reference;out('paymentResult',v)}catch(e){out('paymentResult',e)}};successBtn.onclick=async()=>{if(!paymentRef)return;try{out('paymentResult',await call('/api/v1/uat/payments/'+paymentRef+'/callback',{method:'POST',body:JSON.stringify({organization_id:org.value,result:'0000',signature_valid:true})}))}catch(e){out('paymentResult',e)}};failSigBtn.onclick=async()=>{if(!paymentRef)return;try{out('paymentResult',await call('/api/v1/uat/payments/'+paymentRef+'/callback',{method:'POST',body:JSON.stringify({organization_id:org.value,result:'0000',signature_valid:false})}))}catch(e){out('paymentResult',e)}};queryBtn.onclick=async()=>{if(!paymentRef)return;try{out('paymentResult',await call('/api/v1/uat/payments/'+paymentRef+'?organization_id='+org.value))}catch(e){out('paymentResult',e)}};lang.onchange=()=>{document.documentElement.lang=lang.value==='zh'?'zh-Hant-TW':lang.value;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=text[lang.value][e.dataset.i])};
</script></body></html>
