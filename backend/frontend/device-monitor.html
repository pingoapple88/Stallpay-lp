<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校鮮集｜智慧販賣機遠端監控</title><style>
body{margin:0;background:#0c2723;color:#eef5ef;font:15px/1.6 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:32px 20px}h1{color:#d9b56d}.card{background:#123832;border:1px solid #2c5a50;border-radius:14px;padding:18px;margin:16px 0}label{display:block;color:#a9c3ba;margin:8px 0 3px}input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #2c5a50;background:#0b2824;color:#eef5ef;font:inherit}button{background:#d9b56d;color:#152c27;font-weight:700;margin-top:12px;cursor:pointer}pre{white-space:pre-wrap;background:#091c1a;padding:12px;border-radius:8px}.notice{color:#a9c3ba;border:1px solid #2c5a50;padding:12px;border-radius:10px}</style></head>
<body><main><h1>智慧販賣機｜遠端監控與自動補貨</h1><p class="notice">Mock／Device Simulator。遙測只寫入隔離資料；低庫存會生成「待人工核准」補貨單，不會自動開門、扣款或撥款。</p><section class="card"><label>組織 ID<input id="org" value="00000000-0000-0000-0000-000000000001"></label><label>設備 ID<input id="device" value="00000000-0000-0000-0000-000000000003"></label><label>供應商 ID（可選）<input id="supplier" value="00000000-0000-0000-0000-000000000002"></label><label>SKU<input id="sku" value="synthetic-sku"></label><label>可用庫存<input id="qty" type="number" value="2"></label><label>低庫存門檻<input id="threshold" type="number" value="5"></label><label>連線狀態<select id="connectivity"><option>online</option><option>offline</option><option>unknown</option></select></label><label>溫度 °C<input id="temp" type="number" value="4"></label><button onclick="sendTelemetry()">上報遙測並評估告警</button><pre id="result">等待遙測</pre></section></main><script>
const H={'Content-Type':'application/json','X-Demo-Mode':'true'};const id=()=>crypto.randomUUID();async function sendTelemetry(){const telemetry_id=id();const body={telemetry_id,organization_id:org.value,device_id:device.value,supplier_id:supplier.value||null,sku:sku.value,quantity_available:Number(qty.value),low_stock_threshold:Number(threshold.value),connectivity:connectivity.value,temperature_celsius:Number(temp.value),reported_at_utc:new Date().toISOString(),idempotency_key:'telemetry-'+Date.now()};const r=await fetch('/api/v1/mock/device-monitoring/telemetry',{method:'POST',headers:H,body:JSON.stringify(body)});result.textContent=JSON.stringify(await r.json(),null,2)}
</script></body></html>
